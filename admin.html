<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Management Portal – LocalLink</title>
  <meta name="description" content="LocalLink Platform Administrative Control Panel for managing system bookings, user accounts, and service statuses.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    .admin-stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.25rem;
      margin-bottom: 2rem;
    }
    .admin-stat-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 1.25rem;
      box-shadow: var(--shadow-sm);
    }
    .admin-stat-val {
      font-size: 2rem;
      font-weight: 800;
      color: var(--primary-dark);
    }
    .admin-stat-lbl {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .admin-table-wrap {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      overflow-x: auto;
      margin-bottom: 2rem;
    }
    .admin-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
      text-align: left;
    }
    .admin-table th, .admin-table td {
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--border-light);
    }
    .admin-table th {
      background-color: var(--bg-main);
      color: var(--text-dark);
      font-weight: 700;
    }
    @media screen and (max-width: 768px) {
      .admin-stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>

  <!-- Site Header (Executive Admin Theme) -->
  <header class="site-header dashboard-header">
    <div class="container navbar">
      <a href="admin.html" class="brand-logo">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
        <span>LocalLink Admin</span>
      </a>

      <nav class="nav-links" id="mobileNav">
        <a href="admin.html" class="nav-link active">Admin Portal</a>
        <a href="dashboard.html" class="nav-link">Dashboard</a>
        <a href="providers.html" class="nav-link">Providers</a>
        <div class="mobile-book-btn">
          <a href="booking.html" class="btn btn-primary btn-block">Book a Service</a>
        </div>
      </nav>

      <div class="header-actions">
        <a href="index.html" class="btn btn-sm btn-outline" style="color: #94a3b8; border-color: #334155;">&larr; Main Site</a>
        <div id="navAuthGroup" style="display: flex; align-items: center; gap: 0.75rem;"></div>
        <button class="hamburger-btn" id="hamburgerBtn" aria-label="Toggle Navigation Menu">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main>
    <section class="page-banner" style="background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);">
      <div class="container">
        <h1>Administrative Control Panel</h1>
        <p>Manage system-wide doorstep service requests, customer accounts, and professional assignments.</p>
      </div>
    </section>

    <section class="section">
      <div class="container" id="adminContainer">
        <!-- Rendered dynamically by js/admin.js -->
      </div>
    </section>
  </main>

  <!-- Site Footer -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom" style="border: none; padding: 0;">
        <p>&copy; 2026 LocalLink. Administrative Access Only.</p>
      </div>
    </div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
